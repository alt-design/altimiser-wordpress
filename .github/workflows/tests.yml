name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        wordpress: ['6.8.*', '*']
        yoast: ['*']
        include:
          - php: '8.1'
            wordpress: '6.8.*'
            yoast: '24.0'

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: altimiser_wordpress_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none

      - name: Install dependencies
        run: >-
          composer require --dev --no-interaction --no-progress --prefer-dist --with-all-dependencies
          "roots/wordpress:${{ matrix.wordpress }}"
          "wp-phpunit/wp-phpunit:${{ matrix.wordpress }}"
          "wpackagist-plugin/wordpress-seo:${{ matrix.yoast }}"

      - name: Run tests
        run: vendor/bin/phpunit
