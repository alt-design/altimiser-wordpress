name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Check the tag matches the plugin's version
        run: |
          grep -Fxq " * Version: ${GITHUB_REF_NAME#v}" altimiser.php

      - name: Build the zip
        run: git archive --prefix=altimiser/ -o altimiser.zip HEAD altimiser.php uninstall.php src README.md

      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" altimiser.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
